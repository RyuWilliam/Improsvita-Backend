# Copiloto administrativo (Groq por defecto; se puede cambiar por Ollama con las mismas variables)
spring.ai.openai.base-url=${ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${GROQ_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${ASSISTANT_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=1000
spring.ai.openai.chat.replay-reasoning-content=false
assistant.enabled=${ASSISTANT_ENABLED:true}
assistant.provider=${ASSISTANT_PROVIDER:Groq}
assistant.max-history-messages=8
assistant.max-tool-rows=20
assistant.max-message-length=1000